<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3F51B5" />
<title>Upe timbre — Creá tu aviso de llegada</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #3F51B5, #283593);
    color: #fff; min-height: 100%; padding: 26px 18px 52px; text-align: center;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  .bell { font-size: 58px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
  h1 { font-size: 23px; margin: 12px 0 6px; font-weight: 800; }
  .sub { opacity: .9; font-size: 15px; margin: 0 0 18px; }
  .card {
    background: rgba(255,255,255,.10); border-radius: 18px; padding: 20px;
    margin: 14px 0; text-align: left;
  }
  .card h2 { font-size: 16px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
  .card p { font-size: 13.5px; opacity: .95; margin: 6px 0; }
  .step { display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #283593;
    font-weight: 800; font-size: 14px; flex: 0 0 auto; }
  label { display:block; font-size: 13px; opacity:.85; margin: 10px 0 6px; }
  input[type=text] {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: none;
    font-size: 16px; background: #fff; color: #222;
  }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none; cursor: pointer;
    background: #fff; color: #283593; font-weight: 800; font-size: 16px; border: none;
    padding: 14px 18px; border-radius: 26px; margin: 12px 0 4px; box-shadow: 0 8px 22px rgba(0,0,0,.25);
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity:.6; }
  .btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.55); box-shadow:none; font-size:15px; }
  .btn.danger { background: transparent; color: #FFD2D2; border: 1px solid rgba(255,210,210,.5); box-shadow:none; font-size:13px; padding: 8px 12px; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .qrbox { background:#fff; border-radius:14px; padding:12px; display:inline-block; margin:8px auto 2px; }
  .qrbox svg { display:block; width:190px; height:190px; }
  .center { text-align:center; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:14px;
    background: rgba(0,0,0,.25); padding: 10px 12px; border-radius: 10px; word-break: break-all; }
  .muted { font-size: 12.5px; opacity: .8; }
  .status { min-height: 20px; font-size: 14px; margin-top: 8px; }
  .ok { color:#C8F7C5; } .err { color:#FFD2D2; }
  .hidden { display:none; }
  .pill { display:inline-block; background: rgba(0,0,0,.22); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; margin-top: 6px; }
  .foot { margin-top: 24px; font-size: 12px; opacity: .7; }
  a { color:#fff; }
  hr { border:none; border-top:1px solid rgba(255,255,255,.15); margin:14px 0; }
  details { margin: 8px 0; }
  details summary { cursor:pointer; font-weight: 700; font-size: 14px; padding: 6px 0; }
  details[open] summary { margin-bottom: 6px; }
  ol { padding-left: 22px; margin: 6px 0; } ol li { margin: 4px 0; font-size: 13.5px; }
  .warn { background: rgba(255, 170, 40, .18); border: 1px solid rgba(255, 170, 40, .5);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
  .doorbell-item { background: rgba(255,255,255,.07); border-radius: 14px; padding: 14px;
    margin: 8px 0; display:flex; align-items:center; gap:12px; }
  .doorbell-item .meta { flex:1; min-width:0; }
  .doorbell-item h3 { margin:0; font-size:15px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .doorbell-item .topic { font-size:11px; opacity:.6; font-family: ui-monospace, monospace; }
  .doorbell-item button { background: rgba(255,255,255,.15); color:#fff; border:none;
    border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .doorbell-item .pill-small { font-size:10px; padding:2px 8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bell">📍🔔</div>
    <h1>Creá tu aviso de llegada</h1>
    <p class="sub">Avisá cuando llegaste a casa, al trabajo, al auto…<br>
      Funciona en <strong>iPhone</strong> y Android, sin cuenta y sin instalar nada obligatorio.</p>

    <!-- Lista + alta -->
    <div id="listView"></div>

    <!-- Panel de un timbre seleccionado -->
    <div id="panel" class="hidden"></div>
  </div>

  <script src="qrcode.js"></script>
  <script>
  (function () {
    var STORE_KEY_LIST = "upe_doorbells_v1";
    var STORE_KEY_LEGACY = "toctoc_timbre_v1";
    var SERVER = "https://ntfy.sh";
    var ALPHABET = "abcdefghijkmnpqrstuvwxyz23456789";

    var elList = document.getElementById("listView");
    var elPanel = document.getElementById("panel");

    // Base de la página del timbre (…/timbre/), relativa → sobrevive renombres del repo.
    var ringBase = new URL("../", location.href).href;      // …/timbre/

    function genTopic() {
      var arr = new Uint32Array(14);
      (window.crypto || window.msCrypto).getRandomValues(arr);
      var s = "timbre-";
      for (var i = 0; i < 12; i++) s += ALPHABET[arr[i] % ALPHABET.length];
      return s;
    }
    function uuid() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
        var r = Math.random()*16|0; var v = c=='x'?r:(r&0x3|0x8); return v.toString(16);
      });
    }

    function loadList() {
      try {
        var raw = localStorage.getItem(STORE_KEY_LIST);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      // Migración: si había un timbre v1, lo convertimos en la primera entrada
      try {
        var legacy = JSON.parse(localStorage.getItem(STORE_KEY_LEGACY));
        if (legacy && legacy.topic) {
          var migrated = [{
            id: uuid(), topic: legacy.topic, name: legacy.name || "Mi casa",
            created: legacy.created || Date.now()
          }];
          saveList(migrated);
          try { localStorage.removeItem(STORE_KEY_LEGACY); } catch (e) {}
          return migrated;
        }
      } catch (e) {}
      return [];
    }
    function saveList(list) {
      try { localStorage.setItem(STORE_KEY_LIST, JSON.stringify(list)); } catch (e) {}
    }

    function tagUrl(t) {
      return ringBase + "?t=" + encodeURIComponent(t.topic)
        + "&s=" + encodeURIComponent(SERVER) + "&n=" + encodeURIComponent(t.name);
    }
    function subUrl(t) { return SERVER + "/" + t.topic; }

    function qrSvg(data) {
      try { var qr = qrcode(0, "M"); qr.addData(data); qr.make(); return qr.createSvgTag({ cellSize: 5, margin: 2 }); }
      catch (e) { return '<p class="muted" style="color:#283593">QR no disponible</p>'; }
    }

    function publishTest(t) {
      // priority=5 (max) + tags para que ntfy dispare la notificación más intrusiva posible.
      var url = subUrl(t) + "?title=" + encodeURIComponent("Alguien llegó a " + t.name)
        + "&tags=bell,rotating_light&priority=5";
      return fetch(url, { method: "POST", body: "📍 Prueba — llegada a " + t.name });
    }

    var iosStore = "https://apps.apple.com/app/ntfy/id1625396347";
    var androidStore = "https://play.google.com/store/apps/details?id=io.heckel.ntfy";
    var upeStore = "https://play.google.com/store/apps/details?id=app.toctoc.timbre";
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);

    // -------------- Render lista + alta --------------
    function renderList() {
      var list = loadList();
      elPanel.classList.add("hidden"); elPanel.innerHTML = "";
      elList.classList.remove("hidden");

      var html =
        '<div class="card">'
        + '  <h2>📍 Tus avisos de llegada</h2>'
        + '  <p>Cada timbre es un <strong>lugar</strong>: casa, trabajo, auto, etc. Programás un NFC en cada lugar, y al tocarlo el teléfono avisa <strong>«Llegué a casa»</strong>, <strong>«Llegué al trabajo»</strong>, lo que sea.</p>';

      if (list.length === 0) {
        html += '  <p class="muted">Todavía no tenés ninguno. Creá el primero más abajo.</p>';
      } else {
        html += '<div style="margin-top:10px">';
        list.forEach(function(t, i){
          html +=
            '<div class="doorbell-item" data-id="' + t.id + '">'
            + '  <div class="meta">'
            + '    <h3>📍 ' + escapeHtml(t.name) + '</h3>'
            + '    <div class="topic">' + t.topic + '</div>'
            + '  </div>'
            + '  <button data-action="open" data-id="' + t.id + '">Abrir</button>'
            + '</div>';
        });
        html += '</div>';
      }

      html += '</div>'
        + '<div class="card">'
        + '  <h2><span class="step">+</span> Crear un timbre nuevo</h2>'
        + '  <p>Es para distinguirlo (ej. Casa, Depto 4B, Auto, Oficina).</p>'
        + '  <label for="name">Nombre del lugar</label>'
        + '  <input type="text" id="name" placeholder="Mi casa" maxlength="40" />'
        + '  <button class="btn" id="createBtn">Crear timbre</button>'
        + '  <p class="muted">Se genera un identificador único y privado. Queda guardado en este teléfono.</p>'
        + '</div>';

      elList.innerHTML = html;

      // Delegación de clicks para abrir cards
      elList.querySelectorAll('[data-action="open"]').forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = this.getAttribute("data-id");
          var t = loadList().find(function(x){ return x.id === id; });
          if (t) openDoorbell(t);
        });
      });

      // Crear
      var elCreateBtn = document.getElementById("createBtn");
      var elName = document.getElementById("name");
      elCreateBtn.addEventListener("click", function(){
        var name = (elName.value || "").trim() || ("Mi lugar " + ((loadList().length + 1)));
        var t = { id: uuid(), topic: genTopic(), name: name, server: SERVER, created: Date.now() };
        var list = loadList(); list.push(t); saveList(list);
        openDoorbell(t);
      });
    }

    // -------------- Render de un timbre --------------
    function openDoorbell(t) {
      elList.classList.add("hidden");
      elPanel.classList.remove("hidden");

      elPanel.innerHTML =
        '<div class="card">'
        + '  <button class="btn ghost" id="backBtn">← Volver a la lista</button>'
        + '</div>'

        + '<div class="card center">'
        + '  <div style="font-size:15px">Timbre: <strong id="pName"></strong></div>'
        + '  <div class="pill">tema: <span id="pTopic" class="mono" style="background:none;padding:0"></span></div>'
        + '  <div style="margin-top:10px"><button class="btn danger" id="deleteBtn">Eliminar este timbre</button></div>'
        + '</div>'

        + '<div class="card">'
        + '  <h2><span class="step">1</span> Recibí el aviso en tu teléfono</h2>'
        + '  <p>Elegí cómo querés recibir el aviso cuando alguien toque la etiqueta. La opción con'
        + '     alarma más fuerte es <strong>Upe timbre</strong> (Android).</p>'
        + '  <div class="row" style="margin-top:8px">'
        + '    <a class="btn" href="' + upeStore + '" target="_blank" rel="noopener">🔔 Upe timbre (Android)</a>'
        + '  </div>'
        + '  <hr>'
        + '  <p><strong>Sin Upe timbre (iPhone y otros Android):</strong> usá la app <em>ntfy</em> (gratis).</p>'
        + '  <div class="row">'
        + '    <a class="btn ghost" href="' + iosStore + '" target="_blank" rel="noopener">🍎 iPhone</a>'
        + '    <a class="btn ghost" href="' + androidStore + '" target="_blank" rel="noopener">🤖 Android</a>'
        + '  </div>'
        + '  <p style="margin-top:10px">Abrí ntfy y suscribite (o escaneá el QR):</p>'
        + '  <a class="btn ghost" id="openNtfy" target="_blank" rel="noopener">📲 Abrir en ntfy</a>'
        + '  <div class="center"><div class="qrbox" id="qrSub"></div></div>'
        + '  <p class="muted">Nombre del tema: <span class="mono" id="topicInline" style="background:none;padding:0"></span></p>'
        + '</div>'

        + '<div class="card">'
        + '  <h2>🔊 Que suene fuerte como timbre / despertador</h2>'
        + '  <p>Por defecto ntfy hace un "ding" suave. Para que suene fuerte como un timbre o despertador, hay que configurarlo. Elegí tu plataforma:</p>'
        + '  <details><summary>🍎 En iPhone — ntfy + tono de timbre</summary>'
        + '    <p><strong>Opción A — Cambiar el sonido de la notificación (lo más simple):</strong></p>'
        + '    <ol>'
        + '      <li>Abrí <strong>ntfy</strong> y suscribite al tema del timbre (botón de arriba).</li>'
        + '      <li>Tocá la suscripción → <strong>editar</strong> (ícono lápiz, arriba a la derecha).</li>'
        + '      <li>En <strong>Sound</strong> elegí un tono fuerte (ej. <em>Juntos</em>, <em>Alarma</em>, <em>Reflexión</em>).</li>'
        + '    </ol>'
        + '    <p><strong>Opción B — Que suene aunque esté en silencio (requiere Atajos):</strong></p>'
        + '    <ol>'
        + '      <li>Instalá la app <strong>Atajos</strong> (viene con iOS).</li>'
        + '      <li>Abrí Atajos → <strong>Automatización</strong> → <em>+</em> → <strong>«Al recibir una notificación»</strong>.</li>'
        + '      <li>Elegí <strong>ntfy</strong> como la app. Desactivá "Preguntar antes".</li>'
        + '      <li>Añadí la acción <strong>Reproducir sonido</strong> (de la Biblioteca de Música, un timbre de 30s loop). O <strong>Vibrar dispositivo</strong>.</li>'
        + '      <li>Guardá. Ahora cada notificación de ntfy dispara el sonido fuerte.</li>'
        + '    </ol>'
        + '    <p><strong>Opción C — Alertas críticas (lo más potente):</strong></p>'
        + '    <ol>'
        + '      <li>Ajustes de iOS → <strong>Notificaciones</strong> → <strong>ntfy</strong>.</li>'
        + '      <li>Activá <strong>Alertas urgentes/críticas</strong> y <strong>Sonidos</strong>.</li>'
        + '      <li>Esto hace que suene aunque el iPhone esté en silencio o en No Molestar.</li>'
        + '    </ol>'
        + '    <p class="warn">iOS limita que apps terceras suenen como alarma real. La combinación B+C es lo más cerca que se puede llegar.</p>'
        + '  </details>'
        + '  <details><summary>🤖 En Android — ntfy</summary>'
        + '    <ol>'
        + '      <li>Abrí <strong>ntfy</strong> → <strong>mantené presionada</strong> tu suscripción.</li>'
        + '      <li>Tocá <strong>Editar</strong> → <strong>Sound</strong>.</li>'
        + '      <li>Elegí <strong>Alarm</strong> u otro sonido fuerte del sistema.</li>'
        + '      <li>Volvé → tocá <strong>Notifications</strong> → <strong>Priority</strong>: <strong>Max</strong>.</li>'
        + '      <li>En Ajustes → Notificaciones de ntfy → subí volumen y permitile saltar <em>No molestar</em>.</li>'
        + '    </ol>'
        + '    <p class="muted">Con esto suena fuerte y persistente aunque esté bloqueado.</p>'
        + '  </details>'
        + '  <details><summary>⚡ Lo mejor: usá <strong>Upe timbre</strong> (Android)</summary>'
        + '    <p>La app Upe timbre tiene opción para <strong>sonar aunque esté en silencio</strong> y abre la pantalla a timbre completo. Es nuestra recomendación si tenés Android.</p>'
        + '    <a class="btn" href="' + upeStore + '" target="_blank" rel="noopener">🔔 Instalar Upe timbre</a>'
        + '  </details>'
        + '</div>'

        + '<div class="card">'
        + '  <h2><span class="step">2</span> Tu etiqueta NFC (para el lugar)</h2>'
        + '  <p>Cuando alguien la toque, recibís el aviso. Pegala en la puerta, en el escritorio, donde quieras.</p>'
        + '  <div class="center"><div class="qrbox" id="qrTag"></div></div>'
        + '  <p style="margin-top:12px"><strong>Grabá una etiqueta NFC en blanco</strong> (NTAG213/215/216):</p>'
        + '  <button class="btn" id="writeBtn">📶 Grabar etiqueta ahora</button>'
        + '  <div class="status center" id="writeStatus"></div>'
        + '  <details style="margin-top:10px"><summary>¿No arranca la grabación? / Estoy en iPhone</summary>'
        + '    <p>La grabación por navegador solo funciona en <strong>Chrome para Android 8+</strong>. En iPhone, Safari no permite grabar NFC desde la web:</p>'
        + '    <ol>'
        + '      <li>Instalá gratis <strong>NFC Tools</strong> (en el App Store o Play Store).</li>'
        + '      <li>Dentro de la app elegí <strong>Escribir</strong> → <strong>Añadir un registro</strong> → <strong>URL / URI</strong>.</li>'
        + '      <li>Pegá el enlace de abajo.</li>'
        + '      <li>Tocá <strong>Grabar / Escribir</strong> y apoyá la etiqueta.</li>'
        + '    </ol>'
        + '    <p><strong>iPhone — alternativa con Atajos:</strong> en iOS 13+ podés usar la automatización «Al tocar un NFC» de Atajos para disparar la URL cada vez que tocás la etiqueta (sin grabarla).</p>'
        + '    <label>Enlace para pegar en la etiqueta</label>'
        + '    <div class="mono" id="tagUrlBox"></div>'
        + '    <button class="btn ghost" id="copyTag" style="margin-top:10px">Copiar enlace</button>'
        + '  </details>'
        + '</div>'

        + '<div class="card">'
        + '  <h2><span class="step">3</span> Probá que suene</h2>'
        + '  <p>Primero suscribite / instalá la app (paso 1). Después tocá:</p>'
        + '  <button class="btn ghost" id="testBtn">📍 Enviar aviso de prueba</button>'
        + '  <div class="status center" id="testStatus"></div>'
        + '</div>';

      document.getElementById("pName").textContent = t.name;
      document.getElementById("pTopic").textContent = t.topic;
      document.getElementById("topicInline").textContent = t.topic;
      var openNtfy = document.getElementById("openNtfy");
      openNtfy.href = subUrl(t);
      document.getElementById("qrSub").innerHTML = qrSvg(subUrl(t));
      document.getElementById("qrTag").innerHTML = qrSvg(tagUrl(t));
      document.getElementById("tagUrlBox").textContent = tagUrl(t);

      document.getElementById("backBtn").addEventListener("click", renderList);

      document.getElementById("deleteBtn").addEventListener("click", function(){
        if (!confirm("¿Eliminar «" + t.name + "»? La etiqueta grabada dejará de funcionar.")) return;
        var list = loadList().filter(function(x){ return x.id !== t.id; });
        saveList(list);
        renderList();
      });

      document.getElementById("copyTag").addEventListener("click", function () {
        var btn = this;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(tagUrl(t)).then(function () {
            btn.textContent = "¡Copiado!";
            setTimeout(function(){ btn.textContent = "Copiar enlace"; }, 1500);
          });
        } else {
          var range = document.createRange();
          range.selectNode(document.getElementById("tagUrlBox"));
          window.getSelection().removeAllRanges();
          window.getSelection().addRange(range);
        }
      });

      document.getElementById("writeBtn").addEventListener("click", function () {
        var st = document.getElementById("writeStatus");
        st.className = "status center";

        if (!("NDEFReader" in window)) {
          st.className = "status center err";
          if (isIOS) {
            st.innerHTML = "En iPhone no se puede grabar desde el navegador. Usá <strong>NFC Tools</strong> o <strong>Atajos</strong> — mirá «¿No arranca la grabación?» acá arriba.";
          } else if (!isAndroid) {
            st.innerHTML = "Este navegador no soporta grabación NFC. Probá desde <strong>Chrome en un Android</strong>.";
          } else {
            st.innerHTML = "Tu Chrome no permite grabar NFC. Actualizalo, o probá con <strong>NFC Tools</strong> (link arriba).";
          }
          return;
        }
        st.textContent = "Acercá la etiqueta al teléfono…";
        try {
          var writer = new NDEFReader();
          writer.write({ records: [{ recordType: "url", data: tagUrl(t) }] })
            .then(function () {
              st.className = "status center ok";
              st.textContent = "✅ ¡Etiqueta grabada! Pegala donde quieras avisar la llegada.";
            })
            .catch(function (e) {
              st.className = "status center err";
              st.textContent = "No se pudo grabar: " + e.message;
            });
        } catch (e) {
          st.className = "status center err";
          st.textContent = "Error: " + e.message;
        }
      });

      document.getElementById("testBtn").addEventListener("click", function () {
        var st = document.getElementById("testStatus");
        st.className = "status center"; st.textContent = "Enviando…";
        publishTest(t)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            st.className = "status center ok"; st.textContent = "✅ Enviado. Fijate la notificación en ntfy o Upe timbre.";
          })
          .catch(function (e) { st.className = "status center err"; st.textContent = "No se pudo enviar: " + e.message; });
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
      });
    }

    // ---- init ----
    renderList();
  })();
  </script>
</body>
</html>
