<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3F51B5" />
<title>TocToc — Timbre</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #3F51B5, #283593);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .card { max-width: 420px; width: 100%; }
  .bell {
    font-size: 96px; line-height: 1; display: inline-block;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
  }
  .ringing { animation: swing .35s ease-in-out infinite; }
  @keyframes swing { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
  h1 { font-size: 26px; margin: 22px 0 8px; font-weight: 800; }
  p { font-size: 16px; opacity: .92; margin: 6px 0; }
  .name { font-weight: 700; }
  .btn {
    display: block; margin: 26px 0 0; border: none; cursor: pointer;
    background: #fff; color: #283593; font-weight: 800; font-size: 18px;
    padding: 16px 30px; border-radius: 30px; width: 100%;
    box-shadow: 0 8px 22px rgba(0,0,0,.28); text-decoration: none;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .6; }
  .btn.secondary {
    background: transparent; color: #fff; box-shadow: none;
    font-size: 15px; font-weight: 600; padding: 12px; margin-top: 10px; text-decoration: underline;
  }
  .hidden { display: none; }
  .status { margin-top: 22px; min-height: 24px; font-size: 15px; }
  .ok { color: #C8F7C5; } .err { color: #FFD2D2; }
  .spinner {
    width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%; display: inline-block;
    vertical-align: middle; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { margin-top: 34px; font-size: 12px; opacity: .7; }
  a { color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <div id="bell" class="bell">🔔</div>
    <h1 id="title">Tocar el timbre</h1>
    <p>Avisando a <span class="name" id="who">la casa</span> que estás en la puerta.</p>
    <button class="btn" id="ring">🔔 Tocar timbre</button>
    <button class="btn secondary hidden" id="openApp">Abrir en la app TocToc</button>
    <div class="status" id="status"></div>
    <div class="foot">Enviado con <strong>TocToc</strong> · timbre NFC</div>
  </div>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var topic = qs.get("t") || "";
  var server = (qs.get("s") || "https://ntfy.sh").replace(/\/+$/, "");
  var name = qs.get("n") || "la casa";
  var alreadyWeb = qs.get("app") === "0";
  var isAndroid = /android/i.test(navigator.userAgent);

  var elWho = document.getElementById("who");
  var elStatus = document.getElementById("status");
  var elRing = document.getElementById("ring");
  var elOpenApp = document.getElementById("openApp");
  var elBell = document.getElementById("bell");
  elWho.textContent = name;

  function setStatus(html, cls) { elStatus.className = "status " + (cls || ""); elStatus.innerHTML = html; }

  var published = false;
  // Toca el timbre por web (publica en ntfy). Idempotente: no manda dos veces.
  function ringWeb() {
    if (published || !topic) return;
    published = true;
    elRing.disabled = true;
    elBell.classList.add("ringing");
    setStatus('<span class="spinner"></span> Tocando…');
    var url = server + "/" + encodeURIComponent(topic)
      + "?title=" + encodeURIComponent(name) + "&tags=bell&priority=high";
    fetch(url, { method: "POST", body: "Alguien está tocando el timbre de " + name })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        setStatus("✅ ¡Listo! Ya avisamos que estás en la puerta.", "ok");
        elRing.textContent = "Tocar de nuevo";
      })
      .catch(function () {
        published = false;   // permitir reintento
        setStatus("❌ No se pudo avisar. Tocá «Tocar de nuevo».", "err");
      })
      .finally(function () {
        setTimeout(function () { elBell.classList.remove("ringing"); elRing.disabled = false; }, 1200);
      });
  }

  // Deep link opcional a la app (nunca bloquea el timbre)
  function appIntentUrl() {
    var fb = location.origin + location.pathname + "?t=" + encodeURIComponent(topic)
      + "&s=" + encodeURIComponent(server) + "&n=" + encodeURIComponent(name) + "&app=0";
    return "intent://ring?t=" + encodeURIComponent(topic)
      + "&s=" + encodeURIComponent(server) + "&n=" + encodeURIComponent(name)
      + "#Intent;scheme=toctoc;package=app.toctoc.timbre;"
      + "S.browser_fallback_url=" + encodeURIComponent(fb) + ";end";
  }

  if (!topic) { setStatus("Enlace inválido (falta el identificador del timbre).", "err"); return; }

  elRing.addEventListener("click", function () { published = false; ringWeb(); });

  if (isAndroid && !alreadyWeb) {
    // Intento de abrir la app (mejora, no obligatorio). Si el navegador lo bloquea
    // o no está instalada, IGUAL tocamos por web enseguida.
    elOpenApp.classList.remove("hidden");
    elOpenApp.addEventListener("click", function () { try { location.href = appIntentUrl(); } catch (e) {} });
    try { location.href = appIntentUrl(); } catch (e) {}
    // Red de seguridad: si a los 1.2s seguimos acá (la app no tomó el control), tocamos por web.
    setTimeout(function () {
      if (document.visibilityState === "visible") ringWeb();
    }, 1200);
  } else {
    // iPhone / sin app / ya volvimos del intento → tocar por web de una.
    ringWeb();
  }
})();
</script>
</body>
</html>
