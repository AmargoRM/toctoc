<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3F51B5" />
<title>TocToc — Recibir el timbre (sin la app)</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #3F51B5, #283593);
    color: #fff; min-height: 100%;
    padding: 28px 20px 48px; text-align: center;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .bell { font-size: 64px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
  h1 { font-size: 24px; margin: 14px 0 6px; font-weight: 800; }
  .sub { opacity: .9; font-size: 15px; margin: 0 0 22px; }
  .name { font-weight: 800; }
  .card {
    background: rgba(255,255,255,.10); border-radius: 18px; padding: 20px;
    margin: 16px 0; text-align: left;
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  .step { display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #283593;
    font-weight: 800; font-size: 14px; flex: 0 0 auto; }
  .btn {
    display: block; text-decoration: none; text-align: center; cursor: pointer;
    background: #fff; color: #283593; font-weight: 800; font-size: 17px; border: none;
    padding: 15px 20px; border-radius: 28px; margin: 10px 0; box-shadow: 0 8px 22px rgba(0,0,0,.25);
  }
  .btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.6);
    box-shadow: none; font-size: 15px; }
  .stores { display: flex; gap: 10px; }
  .stores a { flex: 1; }
  .qrbox { background: #fff; border-radius: 14px; padding: 14px; display: inline-block; margin: 6px auto 4px; }
  .qrbox svg { display: block; width: 200px; height: 200px; }
  .topic {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px;
    background: rgba(0,0,0,.25); padding: 10px 12px; border-radius: 10px;
    word-break: break-all; margin-top: 8px;
  }
  .muted { font-size: 13px; opacity: .8; }
  .hint { font-size: 13px; opacity: .85; margin-top: 6px; }
  .foot { margin-top: 26px; font-size: 12px; opacity: .7; }
  a { color: #fff; }
  .err { color: #FFD2D2; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bell">🔔</div>
    <h1>Recibir el timbre en tu teléfono</h1>
    <p class="sub">Timbre: <span class="name" id="who">—</span><br>
      Sirve para <strong>iPhone</strong> o cualquier teléfono, <strong>sin instalar TocToc</strong>.</p>

    <div id="content"></div>

    <div class="foot">Usa <strong>ntfy</strong> (gratis, open-source) como receptor · TocToc</div>
  </div>

  <script src="qrcode.js"></script>
  <script>
  (function () {
    var qs = new URLSearchParams(location.search);
    var topic = qs.get("t") || "";
    var server = (qs.get("s") || "https://ntfy.sh").replace(/\/+$/, "");
    var name = qs.get("n") || "tu casa";
    document.getElementById("who").textContent = name;

    var content = document.getElementById("content");
    if (!topic) {
      content.innerHTML = '<div class="card"><p class="err">Enlace incompleto: falta el identificador del timbre (parámetro <b>t</b>).</p>'
        + '<p class="muted">Pedile a quien te compartió este enlace que lo genere desde la app TocToc.</p></div>';
      return;
    }

    var subUrl = server + "/" + topic;                 // ntfy.sh/<topic>
    var isApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);

    var iosStore = "https://apps.apple.com/app/ntfy/id1625396347";
    var androidStore = "https://play.google.com/store/apps/details?id=io.heckel.ntfy";

    content.innerHTML =
      '<div class="card">'
      + '  <h2><span class="step">1</span> Instalá la app ntfy (gratis)</h2>'
      + '  <div class="stores">'
      + '    <a class="btn" href="' + iosStore + '" target="_blank" rel="noopener">🍎 iPhone</a>'
      + '    <a class="btn" href="' + androidStore + '" target="_blank" rel="noopener">🤖 Android</a>'
      + '  </div>'
      + '  <p class="hint">ntfy es la app que recibe el aviso. Suena aunque el teléfono esté bloqueado.</p>'
      + '</div>'
      + '<div class="card">'
      + '  <h2><span class="step">2</span> Suscribite a tu timbre</h2>'
      + '  <a class="btn" href="' + subUrl + '" target="_blank" rel="noopener">📲 Abrir en ntfy</a>'
      + '  <p class="hint" style="text-align:center">o escaneá este código con la cámara:</p>'
      + '  <div style="text-align:center"><div class="qrbox" id="qr"></div></div>'
      + '  <p class="hint">Si te pide agregar el tema manualmente, usá exactamente este nombre'
      + (server === "https://ntfy.sh" ? "" : (" (servidor <b>" + server + "</b>)")) + ':</p>'
      + '  <div class="topic" id="topic"></div>'
      + '</div>'
      + '<div class="card">'
      + '  <h2><span class="step">3</span> Permití las notificaciones</h2>'
      + '  <p class="muted">Cuando la app lo pida, tocá <b>Permitir</b>. Listo: cada vez que toquen tu '
      + 'etiqueta NFC, te va a llegar el aviso a este teléfono.</p>'
      + '</div>';

    document.getElementById("topic").textContent = topic;

    // Generar el QR del enlace de suscripción (sin depender de internet)
    try {
      var qr = qrcode(0, "M");
      qr.addData(subUrl);
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2 });
    } catch (e) {
      document.getElementById("qr").innerHTML =
        '<p class="muted" style="color:#283593">No se pudo generar el QR. Usá el botón «Abrir en ntfy».</p>';
    }
  })();
  </script>
</body>
</html>
