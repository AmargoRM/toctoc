name: Build TocToc APK

# Compila la app Android y publica un Release con el APK y el manifiesto de
# actualización (latest.json). La app se actualiza sola leyendo ese Release.
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/android-nfc-doorbell-app-y6xc41"
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read app version
        id: ver
        run: |
          CODE=$(grep 'val appVersionCode' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          NAME=$(grep 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($CODE)"

      - name: Build sideload APK (instalación fuera de Play)
        run: ./gradlew :app:assembleSideloadRelease --no-daemon --stacktrace

      - name: Build Play AAB (para subir a Google Play)
        run: ./gradlew :app:bundlePlayRelease --no-daemon --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p ../release
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk ../release/toctoc.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab ../release/upe-timbre-play.aab
          cat > ../release/latest.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/toctoc.apk",
            "notes": "Versión ${{ steps.ver.outputs.name }} de TocToc."
          }
          EOF
          echo "---- latest.json ----"; cat ../release/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          name: TocToc ${{ steps.ver.outputs.name }}
          prerelease: false
          make_latest: true
          files: |
            release/toctoc.apk
            release/upe-timbre-play.aab
            release/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
